name: Supabase Database Keep-Alive

on:
  schedule:
    # Run every 3 days at 00:00 UTC (Supabase pauses projects after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-database:
    name: Heartbeat Ping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Heartbeat Keep-Alive
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://azcgiieritmsabfomqow.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_LGNAOAaNN43C0caiFD_VjQ_6atOakWA' }}
        run: node scripts/keepalive.js
